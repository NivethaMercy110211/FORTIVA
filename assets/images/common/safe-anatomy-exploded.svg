<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%">
  <defs>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2B34"/>
      <stop offset="100%" stop-color="#101A20"/>
    </linearGradient>
    <linearGradient id="door-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243D4C"/>
      <stop offset="100%" stop-color="#162D39"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="850" height="500" fill="#0D151A" rx="16"/>

  <!-- Title -->
  <text x="50" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#F5F7F7">PRECISION RESIDENTIAL SAFE ANATOMY</text>
  <text x="50" y="74" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#B49464">EXPLODED SCHEMATIC OF MONOLITHIC DOOR &amp; CHASSIS</text>

  <!-- Safe Outer Body (Left) -->
  <g transform="translate(60, 110)">
    <polygon points="40,20 220,0 260,40 80,60" fill="#2E4656" stroke="#B49464" stroke-width="1.5"/>
    <polygon points="80,60 260,40 260,300 80,320" fill="url(#body-grad)" stroke="#2E4656" stroke-width="1.5"/>
    <polygon points="40,20 80,60 80,320 40,280" fill="#142129" stroke="#2E4656" stroke-width="1.5"/>
    <!-- Internal Cavity -->
    <rect x="95" y="80" width="145" height="220" rx="4" fill="#0A1014" stroke="#B49464" stroke-dasharray="3 3"/>
    <text x="167" y="195" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#B49464">MONOLITHIC BODY</text>
    <text x="167" y="215" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="10" fill="#95A8B2">FortiCore™ Wall</text>
  </g>

  <!-- Exploded Door Assembly (Right) -->
  <g transform="translate(390, 110)">
    <!-- Door Plate -->
    <rect x="0" y="30" width="180" height="290" rx="8" fill="url(#door-grad)" stroke="#B49464" stroke-width="2"/>
    
    <!-- Heavy Chrome Handle & Wheel -->
    <circle cx="90" cy="175" r="32" fill="#162D39" stroke="#B49464" stroke-width="2"/>
    <line x1="90" y1="135" x2="90" y2="215" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="175" x2="130" y2="175" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="90" cy="175" r="10" fill="#B49464"/>

    <!-- Keypad & Biometric Sensor -->
    <rect x="60" y="65" width="60" height="50" rx="4" fill="#101A20" stroke="#B49464"/>
    <circle cx="90" cy="80" r="8" fill="none" stroke="#67B8DE" stroke-width="1.5"/>
    <rect x="70" y="96" width="40" height="12" rx="2" fill="#162D39"/>

    <!-- Active Locking Bolts protruding -->
    <rect x="180" y="60" width="30" height="28" rx="4" fill="#D4AF37"/>
    <rect x="180" y="120" width="30" height="28" rx="4" fill="#D4AF37"/>
    <rect x="180" y="180" width="30" height="28" rx="4" fill="#D4AF37"/>
    <rect x="180" y="240" width="30" height="28" rx="4" fill="#D4AF37"/>

    <text x="90" y="340" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#F5F7F7">DOOR SLAB ASSEMBLY</text>
    <text x="90" y="356" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="10" fill="#B49464">Tri-Direction Active Boltwork</text>
  </g>

  <!-- Technical Annotations Callouts -->
  <g transform="translate(640, 140)">
    <line x1="-30" y1="35" x2="20" y2="35" stroke="#B49464" stroke-width="1.5"/>
    <circle cx="20" cy="35" r="3" fill="#B49464"/>
    <text x="30" y="38" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#F5F7F7">Biometric Scanner</text>
    <text x="30" y="52" font-family="'Manrope', sans-serif" font-size="10" fill="#95A8B2">Live-tissue optical</text>

    <line x1="-30" y1="125" x2="20" y2="125" stroke="#B49464" stroke-width="1.5"/>
    <circle cx="20" cy="125" r="3" fill="#B49464"/>
    <text x="30" y="128" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#F5F7F7">Tri-Spoke Handle</text>
    <text x="30" y="142" font-family="'Manrope', sans-serif" font-size="10" fill="#95A8B2">Solid stainless steel</text>

    <line x1="0" y1="215" x2="20" y2="215" stroke="#B49464" stroke-width="1.5"/>
    <circle cx="20" cy="215" r="3" fill="#B49464"/>
    <text x="30" y="218" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#F5F7F7">40mm Solid Bolts</text>
    <text x="30" y="232" font-family="'Manrope', sans-serif" font-size="10" fill="#95A8B2">Anti-pry continuous dog bolts</text>
  </g>
</svg>
